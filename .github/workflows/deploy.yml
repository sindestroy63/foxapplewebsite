name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Strip build cache before transfer
        run: rm -rf .next/cache

      - name: Deploy .next to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.56.34.120
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".next/*"
          target: "/opt/foxapple/.next"
          strip_components: 1
          timeout: 120s
          command_timeout: 15m

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.34.120
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /opt/foxapple
            sed -i 's/next", "dev"/next", "start"/' docker-compose.yml
            docker compose up -d app
            docker restart foxapple-app-1
