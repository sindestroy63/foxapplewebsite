name: Test SSH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.34.120
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 1m
          script: uptime
