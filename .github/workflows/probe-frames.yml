name: Probe media frames
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract frames from server media
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.34.120
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 4m
          script: |
            python3 - << 'PY'
            import subprocess, glob, os

            vids = sorted(glob.glob("/var/lib/docker/volumes/foxapple_media_data/_data/*.mp4") + glob.glob("/opt/foxapple/public/*.mp4"))
            print(f"Total video files: {len(vids)}")

            # Check if ffmpeg exists on host
            res = subprocess.run(["which", "ffmpeg"], text=True, capture_output=True)
            has_ffmpeg = bool(res.stdout.strip())
            print(f"Host ffmpeg: {res.stdout.strip() or 'NO'}")

            for v in vids:
                size = os.path.getsize(v)
                fname = os.path.basename(v)
                info = ""
                if has_ffmpeg:
                    r = subprocess.run(["ffmpeg", "-i", v], text=True, capture_output=True)
                    # ffmpeg prints stream info to stderr
                    lines = [l.strip() for l in (r.stderr or "").splitlines() if "Duration" in l or "Stream" in l]
                    info = " | ".join(lines[:3])
                print(f"{fname:30} ({size/1024/1024:.1f} MB) -> {info}")
            PY
