name: Screenshots
on:
  workflow_dispatch:
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Inspect mobile buttons
        run: |
          echo  | base64 -d > inspect-buttons.js
          node inspect-buttons.js
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duo-shot
          path: duo-buttons-mobile.png
