name: Screenshots
on:
  workflow_dispatch:
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Debug info
        run: |
          echo  | base64 -d > debug-info.js
          node debug-info.js
