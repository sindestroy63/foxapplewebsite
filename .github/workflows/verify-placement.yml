name: Verify placement
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Curl placement page
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.34.120
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            python3 - << 'PY'
            import subprocess
            cmd = ["curl", "-sk", "-H", "Host: xn--n1aagcfji.xn--p1ai", "https://127.0.0.1/catalog?group=smartphones&brand=Apple&placement=iphone"]
            res = subprocess.run(cmd, text=True, capture_output=True)
            html = res.stdout or ""
            print("PLACEMENT PAGE HTML BYTES:", len(html))
            print("restore-story in page:", "restore-story" in html)
            print("restore-hero-title in page:", "restore-hero-title" in html)
            print("restore-card in page:", "restore-card" in html)
            print("stories count in page:", html.count("/stories/"))
            PY
