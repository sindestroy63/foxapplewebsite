name: Catalog diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.34.120
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 3m
          script: |
            echo  | base64 -d > /tmp/check-host.py
            python3 /tmp/check-host.py
            rm -f /tmp/check-host.py
