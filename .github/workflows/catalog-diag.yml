name: Catalog diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect stock and prices
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.34.120
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 8m
          script: |
            echo  | base64 -d > /tmp/catalog-diag.py
            python3 /tmp/catalog-diag.py
            rm -f /tmp/catalog-diag.py
