upstream fohstore_app {
    server app:3000;
}

server {
    listen 80;
    server_name 72.56.34.120;
    location / {
        proxy_pass http://fohstore_app;
        proxy_http_version 1.1;
        proxy_set_header Host xn--n1aagcfji.xn--p1ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 80;
    server_name
        xn--n1aagcfji.xn--p1ai www.xn--n1aagcfji.xn--p1ai
        xn--j1achfjp0e.xn--p1ai www.xn--j1achfjp0e.xn--p1ai
        foxapple.ru www.foxapple.ru
        fohstore.ru www.fohstore.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xn--n1aagcfji.xn--p1ai$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name xn--n1aagcfji.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/fohstore-all/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fohstore-all/privkey.pem;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    location / {
        proxy_pass http://fohstore_app;
        proxy_set_header Accept-Encoding "";
        gunzip on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name
        www.xn--n1aagcfji.xn--p1ai
        xn--j1achfjp0e.xn--p1ai www.xn--j1achfjp0e.xn--p1ai
        foxapple.ru www.foxapple.ru
        fohstore.ru www.fohstore.ru;

    ssl_certificate /etc/letsencrypt/live/fohstore-all/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fohstore-all/privkey.pem;

    return 301 https://xn--n1aagcfji.xn--p1ai$request_uri;
}
