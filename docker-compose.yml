name: foxapple

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foxapple}
      POSTGRES_USER: ${POSTGRES_USER:-foxapple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foxapple} -d ${POSTGRES_DB:-foxapple}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foxapple}:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-foxapple}
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost}
      PAYLOAD_ALLOWED_ORIGINS: ${PAYLOAD_ALLOWED_ORIGINS:-http://localhost:3001}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://vibecode.moe/v1}
      OPENAI_PRICE_MODEL: ${OPENAI_PRICE_MODEL:-gpt-5.4-mini}
      OPENAI_RESPONSE_FORMAT: ${OPENAI_RESPONSE_FORMAT:-json_schema}
      PORT: 3000
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      PAYLOAD_SEED_ON_START: ${PAYLOAD_SEED_ON_START:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  media_data:
  certbot_www:
